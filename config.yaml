# Search configuration. Secrets live in .env, not here.

bazos:
  enabled: true
  location: "56201"      # hlokalita (PSČ Ústí nad Orlicí)
  radius_km: 60          # humkreis
  pages: 2               # result pages per search (20 listings each)
  delay_min: 2.0         # random pause between requests, seconds
  delay_max: 5.0
  timeout: 20.0
  retries: 3

  # price_min/price_max = cenaod/cenado; lower bound ~40 % of the cheapest market price in prices.json
  searches:
    # section "mobil"
    - {name: iphone,          section: mobil, query: "iphone",          price_min: 2000, price_max: 45000}
    - {name: apple watch,     section: mobil, query: "apple watch",     price_min: 800,  price_max: 15000}
    - {name: airpods,         section: mobil, query: "airpods",         price_min: 450,  price_max: 10000}
    - {name: ipad,            section: mobil, query: "ipad",            price_min: 1800, price_max: 15000}
    # section "pc"
    - {name: macbook,         section: pc,    query: "macbook",         price_min: 3800, price_max: 45000}
    - {name: playstation,     section: pc,    query: "playstation",     price_min: 400,  price_max: 32000}
    - {name: xbox,            section: pc,    query: "xbox",            price_min: 400,  price_max: 20000}
    - {name: nintendo switch, section: pc,    query: "nintendo switch", price_min: 1000, price_max: 10000}
    - {name: herní pc,        section: pc,    query: "herní pc",        price_min: 5000, price_max: 60000}
    - {name: rtx,             section: pc,    query: "rtx",             price_min: 1800, price_max: 25000}
    - {name: graficka,        section: pc,    category: "graficka",     price_min: 1800, price_max: 25000}

pricing:
  # Buy ceiling (max_price) by market price band, rounded down to 100:
  #   max = min(market * pct / 100, market - min_margin)
  # up_to is the band's upper market price, inclusive; the last band has none.
  max_price_tiers:
    - {up_to: 4999,  pct: 70, min_margin: 1000}   # market < 5 000
    - {up_to: 12000, pct: 78, min_margin: 1200}   # 5 000 – 12 000
    - {pct: 85, min_margin: 2000}                 # > 12 000
  low_liquidity_pct_drop: 4   # liquidity = 1: pct - 4 (70 -> 66, 78 -> 74, 85 -> 81)
  min_profit: 1000            # expected profit (market - price) below this: not a candidate
  min_profit_by_category: {macbook: 2000, gpu: 2000, pc: 2000}  # also the ceiling's min margin in every band
  # First offer = min(offer_cap_pct % of the asking price, max_price - offer_below_max_pct %), down to 100
  offer_cap_pct: 92
  offer_below_max_pct: 5
  max_price_pct: 90           # candidate if price <= 90 % of market ...
  min_price_pct: 40           # ... and >= 40 % (below: "too_cheap", almost always scam or broken)
  stale_days: 14              # older listings: flag "stale" + score penalty
  discount_cap_pct: 45        # discount above this adds no more score
  bundle_accessory_pct: 50    # extra controllers in a console bundle add 50 % of their price list price
  # Score bonus for distance (names as Bazoš prints them)
  home_cities: [Ústí nad Orlicí, Česká Třebová, Choceň, Letohrad, Žamberk, Vysoké Mýto, Lanškroun]
  near_cities: [Pardubice, Hradec Králové, Svitavy, Chrudim, Litomyšl, Rychnov nad Kněžnou, Holice,
                Polička, Králíky, Náchod, Šumperk, Přelouč, Trutnov, Moravská Třebová, Kostelec nad Orlicí,
                Dobruška, Jablonné nad Orlicí, Brandýs nad Orlicí]

gemini:
  enabled: true               # false = notifications with rule-based evaluation only ("без ИИ")
  timeout: 60                 # seconds per request
  retries: 4                  # on 429 (per minute) / 5xx / network errors, exponential backoff
  backoff_base: 5             # seconds, doubled per attempt (or the API's retryDelay)
  # Model ids, RPM/RPD/TPM and quota time zone are in .env (GEMINI_*)

notify:
  max_age_days: 3             # Telegram gets only listings posted in the last 3 days ...
  price_drop_days: 3          # ... or with a price drop in the last 3 days
                              # stale listings (> pricing.stale_days) never: only /top, block "залежавшиеся"
  watch_drop_pct: 5           # "🔁 Снизится — сообщи": alert when the price drops by >= 5 %
  max_alerts_per_run: 8       # Gemini reviews per run; the rest waits for the next run
  pc_specs_per_run: 5         # ready-built PCs: Gemini reads the hardware of at most 5 new ones per run
  interval_min: 10            # Bazoš every 10 min ...
  jitter_s: 90                # ... + random 0-90 s; a run is skipped while the previous one is going
  quiet_start: "00:30"        # quiet hours (Prague): scan every 30 min, alerts go out in a morning digest
  quiet_end: "06:30"
  quiet_interval_min: 30
  gone_checks_per_run: 5      # "✍️ Написал" listings missing from the scan: detail pages checked per run
  gone_check_every_min: 60    # each one at most once per hour
  health_after_min: 30        # no successful scan for 30 min (60 in quiet hours) -> message in Telegram
  startup_message: true       # "🤖 Бот запущен" with the code version after every (re)start

learn:
  # Self-learning price list: every confidently matched listing is an observation (asking price);
  # a listing whose detail page later answers 410 (deleted) counts as a probable sale at its last price.
  window_days: 30             # observations of the last 30 days count
  min_observations: 5         # an item needs 5+ listings to get a proposal
  min_sold: 3                 # 3+ probable sales: their median is the target ...
  asking_to_sold_pct: 95      # ... otherwise median asking price x 95 %
  max_step_pct: 8             # at most +-8 % per weekly report
  min_change_pct: 2           # smaller differences: no proposal
  sold_checks_per_run: 3      # detail pages checked per run (listings gone from the results)
  unseen_days: 1              # missing from the results for a day -> check if it was deleted
  recheck_days: 3             # still online: look again after 3 days
  give_up_days: 30            # stop checking listings first seen longer ago
  new_model_min_listings: 3   # models missing from the price list, suggested from 3+ listings
  report_day: sun             # weekly report: Sunday 19:00 Prague time
  report_time: "19:00"
