[project]
name = "deal-scanner"
version = "0.1.0"
description = "Personal scanner for underpriced used electronics listings (Bazoš, FB Marketplace)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "google-genai>=1.50",
    "aiogram>=3.13,<4",
    "apscheduler>=3.10,<4",
    "playwright>=1.47",  # Facebook Marketplace; Chromium is downloaded on first use (scanner/browser_setup.py)
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
